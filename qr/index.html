<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR code generator</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  main { max-width: 640px; }
  textarea { width: 100%; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; }
  #qrbox { display: flex; justify-content: center; padding: 16px; }
  #qrbox svg { width: min(100%, 320px); height: auto; background: #fff; border-radius: 4px; }
  #qrbox:empty { display: none; }
</style>
</head>
<body>
<main>
  <div class="crumbs"><a href="../">← Utilities</a></div>
  <h1>QR code generator</h1>
  <p class="muted">Turn a link or any text into a QR code. Runs entirely in your browser.</p>

  <div class="card">
    <label>Text or URL<br><textarea id="text" rows="3" autofocus></textarea></label>
    <div class="row" style="margin-top:10px">
      <label>Error correction
        <select id="ec">
          <option value="L">Low (7%) – most data</option>
          <option value="M" selected>Medium (15%)</option>
          <option value="Q">Quartile (25%)</option>
          <option value="H">High (30%) – most robust</option>
        </select>
      </label>
    </div>
  </div>

  <div class="card">
    <p id="msg" class="muted">Enter some text to generate a code.</p>
    <div id="qrbox"></div>
    <div class="row noprint" id="acts" hidden style="justify-content:center">
      <button id="svg">Download SVG</button>
      <button id="png">Download PNG</button>
      <button id="print">Print</button>
    </div>
  </div>
</main>
<script src="../assets/vendor/qrcode.min.js"></script>
<script>
qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];   // default is Latin-1, which mangles non-ASCII
const $ = id => document.getElementById(id);
const QUIET = 4;   // quiet-zone width in modules (the spec minimum)
let current = null;

function buildSvg(qr) {
  const n = qr.getModuleCount(), size = n + QUIET * 2;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + QUIET} ${r + QUIET}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function render() {
  const text = $('text').value;
  current = null; $('qrbox').innerHTML = ''; $('acts').hidden = true;
  if (!text) { $('msg').hidden = false; $('msg').className = 'muted'; $('msg').textContent = 'Enter some text to generate a code.'; return; }
  try {
    const qr = qrcode(0, $('ec').value);   // type 0 = pick the smallest version that fits
    qr.addData(text); qr.make();
    current = buildSvg(qr);
    $('qrbox').innerHTML = current; $('acts').hidden = false;
    $('msg').hidden = true;
  } catch {
    $('msg').hidden = false; $('msg').className = 'bad';
    $('msg').textContent = 'Too much data for a QR code. Shorten the text or lower the error correction.';
  }
}
function save(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('svg').onclick = () => save(new Blob([current], { type: 'image/svg+xml' }), 'qr.svg');
$('png').onclick = () => {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 1024;
    const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(img, 0, 0, 1024, 1024);
    c.toBlob(b => save(b, 'qr.png'));
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(current);
};
$('print').onclick = () => print();
$('text').oninput = $('ec').onchange = render;

// optional prefill: qr/#<url-encoded text>
if (location.hash.length > 1) { try { $('text').value = decodeURIComponent(location.hash.slice(1)); } catch {} }
render();
</script>
</body>
</html>
