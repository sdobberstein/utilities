<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown editor</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  main { max-width: 1200px; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  @media (max-width: 760px) { .panes { grid-template-columns: 1fr; } .panes.edit #preview, .panes.view #editor { display: none; } }
  textarea { width: 100%; height: 70vh; resize: vertical; font: .95rem/1.5 ui-monospace, Menlo, Consolas, monospace; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  #preview { height: 70vh; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 16px; }
  #preview pre { background: var(--bg); padding: 10px; border-radius: 6px; overflow: auto; }
  #preview code { background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  #preview pre code { padding: 0; }
  #preview blockquote { margin-left: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
  #preview img { max-width: 100%; }
  #preview table { margin: 8px 0; } #preview th, #preview td { border: 1px solid var(--line); }
  .toggle { display: none; } @media (max-width: 760px) { .toggle { display: inline-block; } }
  @media print { .panes { display: block; } #editor { display: none !important; } #preview { display: block !important; height: auto; border: 0; overflow: visible; } }
</style>
</head>
<body>
<main>
  <div class="crumbs noprint"><a href="../">← Utilities</a></div>
  <div class="row between noprint">
    <h1>Markdown editor</h1>
    <div class="row">
      <button class="toggle" id="toggle">Preview</button>
      <button id="open">Open…</button>
      <button id="save">Download .md</button>
      <button id="share">Share link</button>
      <button id="copyhtml">Copy HTML</button>
      <button id="print">Print</button>
      <button class="danger" id="clear">Clear</button>
    </div>
  </div>
  <p class="muted noprint">Runs entirely in your browser. Your text is autosaved in this browser only.</p>
  <div class="card noprint" id="shareout" hidden>
    <input type="text" id="sharelink" readonly style="width:100%">
    <div class="row" style="margin-top:8px">
      <button id="sharecopy">Copy</button>
      <a href="#" id="shareopen" target="_blank" rel="noopener">Open →</a>
      <span class="muted" id="sharenote"></span>
    </div>
  </div>
  <input type="file" id="file" accept=".md,.markdown,.txt,text/*" hidden>
  <div class="panes edit" id="panes">
    <div id="editor"><textarea id="src" spellcheck="true" aria-label="Markdown source"></textarea></div>
    <div id="preview" aria-label="Preview"></div>
  </div>
</main>
<script src="../assets/vendor/marked.min.js"></script>
<script src="../assets/vendor/purify.min.js"></script>
<script src="share.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = 'markdown-editor:text';
const SAMPLE = '# Hello\n\nType **markdown** on the left; see it on the right.\n\n- Lists\n- [Links](https://example.com)\n- `code`\n';
let saved = null;
try { saved = localStorage.getItem(KEY); } catch {}
$('src').value = saved ?? SAMPLE;

function render() {
  $('preview').innerHTML = DOMPurify.sanitize(marked.parse($('src').value, { gfm: true, breaks: false }));
  $('preview').querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
}
let t;
$('src').addEventListener('input', () => {
  render();
  clearTimeout(t);
  t = setTimeout(() => { try { localStorage.setItem(KEY, $('src').value); } catch {} }, 300);
});

$('toggle').onclick = () => {
  const p = $('panes'), toPreview = p.classList.contains('edit');
  p.className = 'panes ' + (toPreview ? 'view' : 'edit');
  $('toggle').textContent = toPreview ? 'Edit' : 'Preview';
};
$('open').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $('src').value = await f.text(); e.target.value = '';
  $('src').dispatchEvent(new Event('input'));
};
$('save').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([$('src').value], { type: 'text/markdown' }));
  a.download = 'document.md'; a.click(); URL.revokeObjectURL(a.href);
};
$('copyhtml').onclick = async () => {
  try { await navigator.clipboard.writeText($('preview').innerHTML); $('copyhtml').textContent = 'Copied!'; }
  catch { $('copyhtml').textContent = 'Failed'; }
  setTimeout(() => $('copyhtml').textContent = 'Copy HTML', 1500);
};
$('share').onclick = async () => {
  const url = new URL('view.html', location.href);
  url.hash = await encodeMarkdown($('src').value);
  $('sharelink').value = url.href; $('shareopen').href = url.href;
  $('sharenote').textContent = url.href.length.toLocaleString() + ' characters' + (url.href.length > 8000 ? ' — long; some apps may truncate it' : '');
  $('shareout').hidden = false;
};
$('sharecopy').onclick = async () => {
  try { await navigator.clipboard.writeText($('sharelink').value); $('sharecopy').textContent = 'Copied!'; }
  catch { $('sharelink').select(); }
  setTimeout(() => $('sharecopy').textContent = 'Copy', 1500);
};
$('print').onclick = () => print();
$('clear').onclick = () => {
  if ($('src').value && !confirm('Clear the editor?')) return;
  $('src').value = ''; $('src').dispatchEvent(new Event('input'));
};
// Tab inserts two spaces instead of changing focus
$('src').addEventListener('keydown', e => {
  if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); document.execCommand('insertText', false, '  '); }
});
(async () => {
  if (location.hash.length > 2) {
    try { $('src').value = await decodeMarkdown(location.hash.slice(1)); } catch {}
    history.replaceState(null, '', location.pathname + location.search);
  }
  render();
})();
</script>
</body>
</html>
